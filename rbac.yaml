apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-reconciler
  namespace: agent-reconciler
---
# v0 is read-only. It reads Agents on the mgmt cluster; the KubeVirt side is
# reached via the mounted kubeconfig, whose SA needs get/list on VMs + VMIs there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-reconciler-readonly
rules:
  - apiGroups: ["agent-install.openshift.io"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]
  # Kopf posts events + uses a peering resource for its own coordination.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["get", "list", "watch", "patch"]
# v1 will ADD (do not grant yet): metal3.io/baremetalhosts [delete],
# agent-install.openshift.io/agents [delete], infraenvs [get,list].
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-reconciler-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-reconciler-readonly
subjects:
  - kind: ServiceAccount
    name: agent-reconciler
    namespace: agent-reconciler
